<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="#6366f1"/>

  <!-- Left accent line -->
  <rect x="60" y="60" width="4" height="510" fill="#6366f1" opacity="0.4"/>

  <!-- PROVE BY GENESIS wordmark area -->
  <text x="88" y="108" font-family="monospace" font-size="13" fill="#6366f1" letter-spacing="4" font-weight="bold">PROVE BY GENESIS</text>

  <!-- Main headline -->
  <text x="88" y="200" font-family="monospace" font-size="52" fill="#e2e8f0" font-weight="bold">AI Code Safety Gate</text>

  <!-- Subheadline -->
  <text x="88" y="258" font-family="monospace" font-size="24" fill="#94a3b8">A proof-first gate for AI-generated code.</text>

  <!-- Divider -->
  <line x1="88" y1="300" x2="760" y2="300" stroke="#334155" stroke-width="1"/>

  <!-- Decision pills -->
  <!-- ALLOW -->
  <rect x="88" y="330" width="180" height="52" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="178" y="362" font-family="monospace" font-size="18" fill="#86efac" text-anchor="middle" font-weight="bold">ALLOW</text>

  <!-- REQUIRE_APPROVAL -->
  <rect x="288" y="330" width="280" height="52" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="428" y="362" font-family="monospace" font-size="18" fill="#fde68a" text-anchor="middle" font-weight="bold">REQUIRE_APPROVAL</text>

  <!-- BLOCK -->
  <rect x="588" y="330" width="160" height="52" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="668" y="362" font-family="monospace" font-size="18" fill="#fca5a5" text-anchor="middle" font-weight="bold">BLOCK</text>

  <!-- Code example -->
  <rect x="88" y="410" width="680" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="112" y="444" font-family="monospace" font-size="15" fill="#64748b">// AI-generated code → deterministic classification</text>
  <text x="112" y="474" font-family="monospace" font-size="15" fill="#fca5a5">module.exports = null;   </text>
  <text x="420" y="474" font-family="monospace" font-size="15" fill="#ef4444">→  BLOCK</text>
  <text x="112" y="500" font-family="monospace" font-size="15" fill="#fde68a">if (false) { ... }       </text>
  <text x="420" y="500" font-family="monospace" font-size="15" fill="#f59e0b">→  REQUIRE_APPROVAL</text>

  <!-- Right panel -->
  <rect x="860" y="120" width="280" height="380" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <text x="1000" y="160" font-family="monospace" font-size="12" fill="#6366f1" text-anchor="middle" letter-spacing="3">PROOF CHAIN</text>

  <!-- Chain steps -->
  <text x="900" y="205" font-family="monospace" font-size="14" fill="#94a3b8">→</text>
  <text x="920" y="205" font-family="monospace" font-size="14" fill="#e2e8f0">Proof</text>

  <text x="900" y="240" font-family="monospace" font-size="14" fill="#94a3b8">→</text>
  <text x="920" y="240" font-family="monospace" font-size="14" fill="#e2e8f0">Learning</text>

  <text x="900" y="275" font-family="monospace" font-size="14" fill="#94a3b8">→</text>
  <text x="920" y="275" font-family="monospace" font-size="14" fill="#e2e8f0">Insight</text>

  <text x="900" y="310" font-family="monospace" font-size="14" fill="#94a3b8">→</text>
  <text x="920" y="310" font-family="monospace" font-size="14" fill="#e2e8f0">Outcome</text>

  <text x="900" y="345" font-family="monospace" font-size="14" fill="#94a3b8">→</text>
  <text x="920" y="345" font-family="monospace" font-size="14" fill="#e2e8f0">Contract</text>

  <line x1="880" y1="370" x2="1120" y2="370" stroke="#334155" stroke-width="1"/>

  <text x="900" y="395" font-family="monospace" font-size="11" fill="#475569">Read-only · Metadata only</text>
  <text x="900" y="415" font-family="monospace" font-size="11" fill="#475569">No raw code stored</text>
  <text x="900" y="435" font-family="monospace" font-size="11" fill="#475569">No false success</text>
  <text x="900" y="455" font-family="monospace" font-size="11" fill="#475569">Machine-readable JSON</text>
  <text x="900" y="475" font-family="monospace" font-size="11" fill="#6366f1">INCONCLUSIVE if gap</text>

  <!-- URL -->
  <text x="88" y="576" font-family="monospace" font-size="16" fill="#6366f1">aicodesafety.com</text>
  <text x="88" y="600" font-family="monospace" font-size="12" fill="#475569">hello@aicodesafety.com</text>

  <!-- Bottom accent -->
  <rect x="0" y="626" width="1200" height="4" fill="#6366f1" opacity="0.4"/>
</svg>
